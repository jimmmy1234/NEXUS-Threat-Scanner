<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS Threat Scanner</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600&display=swap');

        body {
            font-family: 'Rajdhani', sans-serif;
            background-color: #050914;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 255, 0.05), transparent 25%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding-top: 8vh;
        }

        .container {
            background: rgba(10, 15, 30, 0.8);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.1), inset 0 0 0 1px rgba(0, 242, 254, 0.2);
            width: 100%;
            max-width: 700px;
            text-align: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 40px;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            margin-top: 0;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        p {
            color: #8b9bb4;
            font-size: 16px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: calc(100% - 40px);
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 6px;
            font-size: 16px;
            font-family: monospace;
            color: #00f2fe;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #00f2fe;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
            background: rgba(0, 0, 0, 0.6);
        }

        button {
            padding: 16px 40px;
            background: linear-gradient(90deg, #093028 0%, #237A57 100%);
            color: #ffffff;
            border: 1px solid #237A57;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(35, 122, 87, 0.4);
            margin-bottom: 10px;
        }

        button:hover {
            background: linear-gradient(90deg, #237A57 0%, #093028 100%);
            box-shadow: 0 0 25px rgba(35, 122, 87, 0.7);
            transform: translateY(-2px);
        }

        .hidden { display: none !important; }

        #loading {
            margin-top: 30px;
            font-size: 15px;
            font-family: monospace;
            color: #00f2fe;
            letter-spacing: 2px;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(0, 242, 254, 0.3);
            border-top-color: #00f2fe;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            vertical-align: middle;
            margin-right: 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #result, #errorBox {
            margin-top: 35px;
            padding: 25px;
            border-radius: 8px;
            text-align: left;
            animation: scanline 0.5s ease-out forwards;
        }

        @keyframes scanline {
            0% { opacity: 0; transform: translateY(20px); clip-path: inset(100% 0 0 0); }
            100% { opacity: 1; transform: translateY(0); clip-path: inset(0 0 0 0); }
        }

        h2#riskLevel {
            margin-top: 0;
            font-size: 24px;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .safe { background: rgba(16, 185, 129, 0.1); border: 1px solid #10b981; color: #34d399; box-shadow: 0 0 20px rgba(16, 185, 129, 0.1); }
        .warning { background: rgba(245, 158, 11, 0.1); border: 1px solid #f59e0b; color: #fbbf24; box-shadow: 0 0 20px rgba(245, 158, 11, 0.1); }
        .danger { background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; color: #f87171; box-shadow: 0 0 20px rgba(239, 68, 68, 0.2); }

        #errorBox { background: rgba(220, 38, 38, 0.1); border: 1px dashed #dc2626; color: #fca5a5; font-family: monospace; }

        .anatomy-container {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 25px 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .anatomy-part {
            padding: 10px 16px;
            border-radius: 4px;
            font-size: 14px;
            font-family: monospace;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.1);
            color: #e2e8f0;
            word-break: break-all;
        }

        .part-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
        }

        .anatomy-part.safe-part { border-color: rgba(16, 185, 129, 0.5); }
        .anatomy-part.safe-part .part-label { color: #10b981; }

        .anatomy-part.warning-part { border-color: rgba(245, 158, 11, 0.5); }
        .anatomy-part.warning-part .part-label { color: #f59e0b; }

        .anatomy-part.danger-part { border-color: rgba(239, 68, 68, 0.5); }
        .anatomy-part.danger-part .part-label { color: #ef4444; }

        ul {
            margin: 20px 0 0 25px;
            padding: 0;
            font-size: 16px;
            line-height: 1.8;
        }
        li { margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="container" id="initContainer">
        <h1>System Initialization</h1>
        <p>Awaiting valid API token sequence.</p>
        <div class="input-group">
            <input type="password" id="sysKey" placeholder="Enter Token (AIza...)">
        </div>
        <button id="initBtn">Authenticate</button>
    </div>

    <div class="container hidden" id="mainContainer">
        <h1>NEXUS Threat Scanner</h1>
        <p>A.I. Heuristic Deep Analysis Matrix</p>
        
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="TARGET_URL > e.g., http://secure-login.paypal.com@192.168.1.1/update">
        </div>
        <button id="checkButton">Initiate Scan</button>

        <div id="loading" class="hidden"><span class="spinner"></span> Establishing secure link to A.I. core...</div>

        <div id="errorBox" class="hidden"></div>

        <div id="result" class="hidden">
            <h2 id="riskLevel"></h2>
            <div id="urlAnatomy" class="anatomy-container"></div>
            <ul id="warningsList"></ul>
        </div>
    </div>

    <script>
        let sysToken = "";

        document.getElementById('initBtn').addEventListener('click', () => {
            const keyInput = document.getElementById('sysKey').value;
            sysToken = keyInput.replace(/\s+/g, ''); 
            
            if (sysToken.startsWith("AIza")) {
                document.getElementById('initContainer').classList.add('hidden');
                document.getElementById('mainContainer').classList.remove('hidden');
            } else {
                alert("Invalid Token. Must begin with 'AIza'.");
            }
        });

        document.getElementById('checkButton').addEventListener('click', analyzeUrl);

        async function analyzeUrl() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const resultDiv = document.getElementById('result');
            const errorBox = document.getElementById('errorBox');
            const riskLevel = document.getElementById('riskLevel');
            const warningsList = document.getElementById('warningsList');
            const anatomyDiv = document.getElementById('urlAnatomy');
            const loadingDiv = document.getElementById('loading');

            if (!urlInput) {
                alert("Target URL required for scan.");
                return;
            }

            warningsList.innerHTML = '';
            anatomyDiv.innerHTML = '';
            resultDiv.classList.add('hidden');
            resultDiv.className = '';
            errorBox.classList.add('hidden');
            errorBox.textContent = '';
            loadingDiv.innerHTML = '<span class="spinner"></span> Establishing secure link to A.I. core...';
            loadingDiv.classList.remove('hidden');

            const promptText = `Analyze this URL for phishing and cybersecurity threats: "${urlInput}". 
            Return ONLY a JSON object. The JSON must have this exact structure:
            {
                "riskCategory": "safe",
                "riskTitle": "Low Risk",
                "warnings": ["warning 1"],
                "anatomy": [
                    { "label": "Protocol", "text": "https://", "style": "safe" }
                ]
            }
            Valid riskCategory values: "safe", "warning", "danger".
            Valid style values: "safe", "warning", "danger", "default".`;

            try {
                let retries = 3;
                let delay = 2000;
                let success = false;
                let data = null;

                while (retries > 0 && !success) {
                    try {
                        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${sysToken}`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                contents: [{
                                    parts: [{ text: promptText }]
                                }]
                            })
                        });

                        if (!response.ok) {
                            const errorData = await response.json();
                            const statusCode = errorData.error?.code || response.status;
                            
                            if (statusCode === 503 || statusCode === 429) {
                                throw new Error('RETRY_TRIGGER');
                            } else {
                                throw new Error(`Google API Message: ${errorData.error?.message || 'Unknown server error'} (Code: ${statusCode})`);
                            }
                        }

                        data = await response.json();
                        success = true;
                    } catch (err) {
                        if (err.message === 'RETRY_TRIGGER' && retries > 1) {
                            retries--;
                            loadingDiv.innerHTML = `<span class="spinner"></span> Network congested. Rerouting... (${retries} attempts left)`;
                            await new Promise(resolve => setTimeout(resolve, delay));
                            delay *= 2;
                        } else {
                            let finalError = err.message === 'RETRY_TRIGGER' ? "A.I. Core unresponsive. Try again later. (Code: 503)" : err.message;
                            throw new Error(finalError);
                        }
                    }
                }

                let rawText = data.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/```json/gi, '').replace(/```/g, '').trim();

                const resultData = JSON.parse(rawText);

                loadingDiv.classList.add('hidden');
                resultDiv.classList.remove('hidden');
                
                resultDiv.classList.add(resultData.riskCategory);
                riskLevel.textContent = resultData.riskTitle;

                if (resultData.anatomy && Array.isArray(resultData.anatomy)) {
                    resultData.anatomy.forEach(part => {
                        if (!part.text) return;
                        const span = document.createElement('span');
                        span.className = `anatomy-part ${part.style}-part`;
                        span.innerHTML = `<span class="part-label">${part.label}</span>${part.text}`;
                        anatomyDiv.appendChild(span);
                    });
                }

                if (resultData.warnings && resultData.warnings.length > 0) {
                    resultData.warnings.forEach(w => {
                        const li = document.createElement('li');
                        li.textContent = w;
                        warningsList.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.textContent = "Zero anomalies detected. Structure appears sound.";
                    warningsList.appendChild(li);
                }

            } catch (error) {
                loadingDiv.classList.add('hidden');
                errorBox.classList.remove('hidden');
                errorBox.textContent = `CRITICAL FAILURE: ${error.message}`;
            }
        }
    </script>
</body>
</html>
